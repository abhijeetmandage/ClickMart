<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickMart</title>
</head>
<body>
    <section>
		<div class="mb-3">
			<a href="/admin/" class="text-decoration-none fs-4"><i class="fa-regular fa-circle-left"></i> Back</a>
		</div>
		<div class="container-fluid p-5 mt-5">
			<div class="row">
				<div class="col-md-3">
					<div class="card card-sh">
						<div class="card-header text-center">
							<P class="fs-4">Add Category</P>
							<th:block th:if="${session.succMsg}">
							    <p class="text-success fw-bold">
							        [[${session.succMsg}]]
							    </p>
								<th:block th:text="${@commonServiceimpl.removeSessionMessage()}"></th:block>
							</th:block>
							<th:block th:if="${session.errorMsg}">
							    <p class="text-danger fw-bold">
							        [[${session.errorMsg}]]
							    </p>
								<th:block th:text="${@commonServiceimpl.removeSessionMessage()}"></th:block>
							</th:block>
						</div>						
						<div class="card-body">
							<form action="/admin/saveCategory" method="post" enctype="multipart/form-data">
								<div class="mb-3">
									<label>Enter Category</label>
									<input type="text" name="name"class="form-control">
								</div>
								<div class="mb-3">
									<label>Status</label>
									<div class="form-check">
									  <input class="form-check-input" type="radio" name="isActive" id="radioDefault1" checked value="true">
									  <label class="form-check-label" for="radioDefault1">
									    Active
									  </label>
									</div>
									<div class="form-check">
									  <input class="form-check-input" type="radio" name="isActive" id="radioDefault2" value="false" >
									  <label class="form-check-label" for="radioDefault2">
									    Inactive
									  </label>
									</div>
								</div>
								<div class="mb-3">
									<label>Upload Image</label>
									<input type="file" name="file" class="form-control">
								</div>
								<button class="btn btn-primary col-md-12 mt-2">Submit</button>
							</form>
						</div>
					</div>
				</div>
				<div class="col-md-8">
					<div class="card card-sh">
						<div class="card-header text-center fs-4">Category Details</div>
						<div class="card-body">
							<table class="table">
							  <thead>
							    <tr>
							      <th scope="col">Sl No</th>
							      <th scope="col">Category</th>
								  <th scope="col">Status</th>
							      <th scope="col">Image</th>
							      <th scope="col">Action</th>
							    </tr>
							  </thead>
							  <tbody>
							    <tr th:each="cat,c:${categories}">
							      <th scope="row">[[${c.count}]]</th>
							      <td>[[${cat.name}]]</td>
								  <td>[[${cat.isActive}]]</td>
							      <td><img th:src="@{'/img/category_img/'+${cat.imageName}}"
									width="50px" height="50px"></td>									
									<td>
									    <a th:href="@{'/admin/loadEditCategory/'+${cat.id}}" class="btn btn-primary" style="text-transform: none;">
									        <i class="fa-regular fa-pen-to-square fa-1x"></i> Edit
									    </a>

									    <a th:href="@{'/admin/deleteCategory/'+${cat.id}}" class="btn btn-danger" style="text-transform: none;">
									        <i class="fa-regular fa-trash-can fa-1x"></i> Delete
									    </a>
									</td>
							    </tr>							    
							  </tbody>
							</table>
							<div class="row mt-3">
							    <div class="col-md-4 fw-bold">
							        Total Categories : [[${totalElements}]]
							    </div>
							    <div class="col-md-8">
							        <nav>
							            <ul class="pagination justify-content-center">
							                <!-- Previous -->
							                <li class="page-item"
							                    th:if="${isFirst != null and !isFirst}">
							                    <a class="page-link"
							                       th:href="@{'/admin/category?pageNo=' + ${pageNo-1} + '&pageSize=' + ${pageSize}}">
							                        &laquo;
							                    </a>
							                </li>
							                <!-- Page Numbers -->
							                <li class="page-item"
							                    th:each="i : ${#numbers.sequence(1,totalPages)}"
							                    th:classappend="${pageNo == i-1} ? 'active' : ''">
							                    <a class="page-link"
							                       th:href="@{'/admin/category?pageNo=' + ${i-1} + '&pageSize=' + ${pageSize}}">
							                        [[${i}]]
							                    </a>
							                </li>
							                <!-- Next -->
							                <li class="page-item"
							                    th:if="${isLast != null and !isLast}">
							                    <a class="page-link"
							                       th:href="@{'/admin/category?pageNo=' + ${pageNo+1} + '&pageSize=' + ${pageSize}}">
							                        &raquo;
							                    </a>
							                </li>
							            </ul>
							        </nav>
							    </div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>	
	</section>
</body>
</html>
