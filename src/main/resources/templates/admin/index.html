<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickMart</title>
</head>
<body>
    <section>
		<div class="container p-5">
			<p class="text-center fs-3 fw-bold">Admin Dashbord</p>
			<div class="row p-5">
				<div class="col-md-4 mt-2">
					<a href="/admin/add_product" class="text-decoration-none">
						<div class="card card-sh">
							<div class="card-body text-center text-primary">
								<i class="fa-solid fa-square-plus fa-3x"></i>
								<h4>Add Product</h4>
							</div>
						</div>
					</a>
				</div>
				<div class="col-md-4 mt-2">
					<a href="/admin/category" class="text-decoration-none">
						<div class="card card-sh">
							<div class="card-body text-center "style="color:#7C3AED;">
								<i class="fa-solid fa-layer-group fa-3x"></i>
								<h4>Category</h4>
							</div>
						</div>
					</a>
				</div>
				<div class="col-md-4 mt-2">
					<a href="/admin/products" class="text-decoration-none">
						<div class="card card-sh">
							<div class="card-body text-center text-success">
								<i class="fa-regular fa-eye fa-3x"></i>
								<h4>View Product</h4>
							</div>
						</div>
					</a>
				</div>
				<div class="col-md-4 mt-4">
					<a href="#" class="text-decoration-none">
						<div class="card card-sh">
							<div class="card-body text-center text-warning">
								<i class="fa-solid fa-bookmark fa-3x"></i>
								<h4>Orders</h4>
							</div>
						</div>
					</a>
				</div>
				<div class="col-md-4 mt-4">
					<a href="/admin/users" class="text-decoration-none">
						<div class="card card-sh">
							<div class="card-body text-center "style="color:#10B981;">
								<i class="fa-solid fa-user-gear fa-3x"></i>
								<h4>Users</h4>
							</div>
						</div>
					</a>
				</div>
				<div class="col-md-4 mt-4">
					<a href="#" class="text-decoration-none">
						<div class="card card-sh">
							<div class="card-body text-center" style="color:#06B6D4;">
								<i class="fa-solid fa-circle-user fa-3x"></i>
								<h4>Add Admin</h4>
							</div>
						</div>
					</a>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
