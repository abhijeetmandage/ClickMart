<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickMart</title>
</head>
<body>
    <section class="min-vh-100 d-flex align-items-center">
		<div class="container mt-5 p-5">
		    <div class="row">
		        <div class="col-md-6 p-5">
		            <img alt="" src="img/login1.jpeg" width="100%" height="400px">
		        </div>
		        <div class="col-md-6 mt-5 p-5">
		            <div class="card shadow-lg p-3 mb-5 bg-body-tertiary rounded">
		                <div class="card-header">
		                    <p class="fs-4 text-center">Forgot Password</p>
								<th:block th:if="${session.succMsg}">
								    <p class="text-success fw-bold text-center">
								        [[${session.succMsg}]]
								    </p>
									<th:block th:text="${@commonServiceimpl.removeSessionMessage()}"></th:block>
								</th:block>
								<th:block th:if="${session.errorMsg}">
								    <p class="text-danger fw-bold text-center">
								        [[${session.errorMsg}]]
								    </p>
									<th:block th:text="${@commonServiceimpl.removeSessionMessage()}"></th:block>
								</th:block>
							
		                </div>
		                <div class="card-body">
		       	             <form action="/forgot-Password" method="post">
		                        <div class="mb-3">
		                            <label class="form-label">Email</label>
		                            <input class="form-control"
		                                   name="email"
		                                   type="email">
		                        </div>
		                       
		                        <button type="submit"
		                                class="btn bg-primary text-white col-md-12">
		                            Send
		                        </button>
		                    </form>
		                </div>						
		            </div>
		        </div>
		    </div>
		</div>
	</section>	
</body>
</html>
