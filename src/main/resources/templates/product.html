<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickMart</title>
</head>
<body>
	<section>
		<div class="container-fluid  p-4  "style="background-color:#4E4E4F;">
			<div class="row">
				<div class="col-md-8 offset-md-2">
					<form action="search" method="get">
						<div class="input-group">
							<input type="text" class="form-control" name="ch" placeholder="Search ClickMart.in"  required>
							<button class="btn btn-light text-dark ms-3 col-md-2"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
						</div>
					</form>
				</div>
			</div>
		</div>
		<div class="container-fluid mt-1">
			<div class="row">
				<div class="col-md-2 p-0">
					<div class="card shadow-sm p-0 mb-5 bg-body-tertiary rounded">
						<div class="card-body card-sh">
							<div class="list-group ">
								<p class="fs-4 text-center">Categories</p>
							  <a href="/product" 
							  class="list-group-item list-group-item-action " 
							  aria-current="true"
							  th:classappend="${paramValue==''}? 'active':''">
							    All
							  </a>
							  <a  th:each="c:${categoreis}"  
							  th:href="@{/product(category=${c.name})}"
							  th:classappend="${paramValue == c.name} ? 'active' :''"
							  class="list-group-item list-group-item-action card-sh ">[[${c.name}]]</a>
							  
							</div>
						</div>
					</div>
				</div>
				<div class="col-md-10">
					<div class="card shadow-sm p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-body ">
							<p class="fs-3 text-center">Products</p> 
							<div class="row">
								<th:block th:if="${productsSize>0}">
									<div class="col-md-3" th:each="p:${products}">
										<div class="card">
											<div class="card-body text-center ">
												<img alt="" th:src="@{'/img/product_img/'+ ${p.image}}"width="100%" height="150px">
												<p class="fs-5 text-center">[[${p.title}]]</p>
												<div class="row text-center">
													<p class="fs-6 fw-bold ">
														<span>&#8377; [[${p.discountPrice}]]</span> <br>
														<span class="text-decoration-line-through text-secondary">&#8377; [[${p.price}]]</span>
													<span class="fs-6 text-success">[[${p.discount}]]% off</span>
													</p>
													<a th:href="@{'/view_product/'+ ${p.id}}"class="btn btn-primary col-md-6 offset-md-3">
														View Details
													</a>
												</div>
											</div>
										</div>							
									</div>
								</th:block>
								<th:block th:unless="${productsSize>0}">
									<P class="fs-4 text-center mt-4 text-danger">Product not availabel yet</P>
								</th:block>
							</div>
						</div>
					</div>
					<!--Start pagination-->
					<div class="row">
					    <div class="col-md-4 fw-bold">
					        Total Products : [[${totalElements}]]
					    </div>

					    <div class="col-md-4">
					        <nav aria-label="Page navigation example">
					            <ul class="pagination justify-content-center">

					                <!-- Previous Button -->
					                <li class="page-item" th:if="${isFirst != null and !isFirst}">
					                    <a class="page-link"
					                       th:href="@{'/product?pageNo=' + ${pageNo-1} + '&pageSize=' + ${pageSize}}"
					                       aria-label="Previous">
					                        <span aria-hidden="true">&laquo;</span>
					                    </a>
					                </li>

					                <!-- Page Numbers -->
					                <li th:if="${totalPages != null}"
									    th:each="i : ${#numbers.sequence(1,totalPages)}"
									    class="page-item"
									    th:classappend="${pageNo == i-1} ? 'active' : ''">

					                    <a class="page-link"
					                       th:href="@{'/product?pageNo=' + ${i-1} + '&pageSize=' + ${pageSize}}">
					                        [[${i}]]
					                    </a>
					                </li>

					                <!-- Next Button -->
					                <li class="page-item" th:if="${isLast != null and !isLast}">
					                    <a class="page-link"
					                       th:href="@{'/product?pageNo=' + ${pageNo+1} + '&pageSize=' + ${pageSize}}"
					                       aria-label="Next">
					                        <span aria-hidden="true">&raquo;</span>
					                    </a>
					                </li>

					            </ul>
					        </nav>
					    </div>
					</div>
					<!-- End Pagination -->
				</div>
			</div>
		</div>
	</section>
</body>
</html>
