<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickMart</title>
</head>
<body>
    <section>
		<div class="container mt-5 p-5">
			<form action="/user/save-Order" method="post" id="orders">
		    <div class="row">
		        <div class="col-md-6 ">		           
					<div class="mb-5 row">
						<P class="text-center fs-4 ">Billing Address</P>
						<hr>
						<div class="col p-1">
							<label>First Name</label>
							<input type="text" name="firstName" 
							 class="form-control col">
						</div>
						<div class="col p-1">
							<label>Last Name</label>
							<input type="text" name="lastName"
							 class="form-control col ms-2">
						 </div>
					</div>
					<div class="mb-5 row">
						<div class="col p-1">
							<label>Email</label>
							<input type="email" name="email" 
							class="form-control col">
						</div>
						<div class="col p-1">
							<label>Mobile Number</label>
							<input type="text" name="mobileNo"
							 class="form-control col ms-2">
						 </div>
					</div>
					<div class="mb-5 row">
						<div class="col p-1">
							<label>Address</label>
							<input type="text" name="address" 
							class="form-control col">
						</div>
						<div class="col p-1">
							<label>City</label>
							<input type="text" name="city"
							  class="form-control col ms-2">
						 </div>
					</div>
					<div class="mb-5 row">
						<div class="col p-1">
							<label>State</label>
							<input type="text" name="state" 
							 class="form-control col">
						</div>
						<div class="col p-1">
							<label>Pincode</label>
							<input type="number" name="pincode"
							 class="form-control col ms-2">
						 </div>
					</div>				
		        </div>
		        <div class="col-md-6 ">
					<P class="text-center fs-4 ">Payment Type</P>
					<hr>
					<div class="card">
						<div class="card-body">
							<table class="table table-borderless">
								<tbody>
									<tr>
										<td>Total Price</td>
										<td>:</td>
										<td>&#8377; [[${orderPrice}]]</td>
									</tr>
									<tr>
										<td>Delivery Fee</td>
										<td>:</td>
										<td> &#8377; 25</td>
									</tr>
									<tr>
										<td>Tax</td>
										<td>:</td>
										<td>&#8377; 5</td>
									</tr>
									<tr class="border-top">
										<td>Total Price</td>
										<td>:</td>
										<td>&#8377; [[${totalOrderPrice}]]</td>
									</tr>
								</tbody>
							</table>						
						</div>
					</div>
		            <div class="card shadow-lg p-3 mb-5 mt-2 bg-body-tertiary rounded">		        
		                <div class="card-body">
	                        <div class="mb-3">
	                            <label class="form-label">Select Payment Type</label>
								<select name="paymentType" class="form-control">
		                            <option class="text-center">---select---</option>
									<option value="COD">Cash On Delivery</option>
									<option value="ONLINE">Online Payment</option>
								</select>
	                        </div>		                 
	                        <button class="btn bg-primary text-white col-md-12">Place Order</button>
		                </div>						
		            </div>
		        </div>
		    </div>
			</form>
		</div>
	</section>	
</body>
</html>
