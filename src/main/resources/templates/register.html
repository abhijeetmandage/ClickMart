<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{base::Layout(~{::section})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickMart</title>
</head>
<body>
    <section>
		<div class="container mt-5 p-5">
		    <div class="row">
		        <div class="col-md-5 p-5">
		            <img alt="" src="img/login1.jpeg" width="100%" height="400px">
		        </div>
		        <div class="col-md-7  p-2">
		            <div class="card shadow-lg p-3 mb-5 bg-body-tertiary rounded">
		                <div class="card-header">
		                    <p class="fs-4 text-center">Register</p>
		                </div>
		                <div class="card-body">
		                    <form>
								<div class="row">
			                        <div class="col">
			                            <label class="form-label">Full Nmae</label>
										<input class="form-control" name="name" type="text">
			                        </div>
									<div class="col">
			                            <label class="form-label">Mobile Number</label>
										<input class="form-control" name="mobileNumber" type="number">
			                        </div>
								</div>
								<div class="mb-3">
		                            <label class="form-label">Email</label>
									<input class="form-control" name="email" type="email">
		                        </div>
								<div class="row">
			                        <div class="col">
			                            <label class="form-label">Address</label>
										<input class="form-control" name="address" type="text">
			                        </div>
									<div class="col">
			                            <label class="form-label">City</label>
										<input class="form-control" name="city" type="text">
			                        </div>
								</div>
								<div class="row">
			                        <div class="col">
			                            <label class="form-label">State</label>
										<input class="form-control" name="state" type="text">
			                        </div>
									<div class="col">
			                            <label class="form-label">Pincode</label>
										<input class="form-control" name="Pincode" type="number">
			                        </div>
								</div>
								<div class="row">
			                        <div class="col">
			                            <label class="form-label">Password</label>
										<div class="input-group">
									        <input type="password"
									               class="form-control"
									               name="password">

									        <span class="input-group-text">
									            <i class="fa-solid fa-lock"></i>
									        </span>
									    </div>
			                        </div>
									<div class="col">
			                            <label class="form-label">Confirm Password</label>
										<div class="input-group">
									        <input type="password"
									               class="form-control"
									               name="password">
	
									        <span class="input-group-text">
									            <i class="fa-solid fa-lock"></i>
									        </span>
									    </div>
			                        </div>
								</div>
								<div class="mb-3 mt-3">
									 <label class="form-label">Profile Image</label>
									 <input class="form-cntrol" name="profile_image" type="file">
								</div>
		                        <button type="submit"
		                                class="btn bg-primary text-white col-md-12">
		                            Register
		                        </button>
		                    </form>
		                </div>
						<div class="card-footer text-center">
							 have an account?
							<a href="/login"class="text-decoration-none">
								Login
							</a>
						</div>
		            </div>
		        </div>
		    </div>
		</div>
	</section>
	
</body>
</html>
